<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yayın paneli</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f6f3;color:#202624;font:16px/1.45 system-ui,sans-serif}header,main,nav{max-width:760px;margin:auto}header{padding:22px 20px 8px}h1{font-size:25px;margin:0}h2{font-size:20px;margin:0 0 12px}h3{font-size:17px;margin:0 0 8px}.muted{color:#59645f}small{font-size:16px;color:#59645f}nav{display:flex;overflow:auto;gap:6px;padding:8px 16px 16px}button{font:inherit;border:0;background:transparent;color:#45514b;padding:10px 12px;border-radius:10px;white-space:nowrap;cursor:pointer}button[aria-selected=true]{background:#203d32;color:white}main{padding:0 16px 32px}.card{background:white;border:1px solid #dfe5df;border-radius:16px;padding:16px;margin-bottom:12px}.row{display:flex;gap:12px;padding:11px 0;border-top:1px solid #eef0ed}.row:first-of-type{border-top:0}.time{font-weight:700;min-width:48px}.content{min-width:0;flex:1}.title{font-weight:650;overflow-wrap:anywhere}.platforms{color:#246046;font-size:16px;white-space:nowrap}.status{display:inline-block;width:10px;height:10px;border-radius:50%;background:#b67616;margin-right:7px}.green{background:#228158}.red{background:#bd3737}details summary{cursor:pointer;font-weight:700}details p{margin:10px 0 0}.attention{border-left:4px solid #bb7615}.empty{color:#59645f;margin:0}.hidden{display:none}a{color:#19563b}footer{color:#59645f;padding:0 16px 24px;max-width:760px;margin:auto}
</style></head><body><header><h1>Yayın paneli</h1><small id="stamp"></small></header><nav aria-label="Panel sekmeleri"><button data-tab="home" aria-selected="true">Bugün</button><button data-tab="calendar" aria-selected="false">Takvim</button><button data-tab="channels" aria-selected="false">Kanallar</button><button data-tab="production" aria-selected="false">Üretim</button><button data-tab="system" aria-selected="false">Sistem</button></nav><main id="app"><div class="card">Veriler açılıyor…</div></main><footer>Türkiye saati · Veriler yalnızca okuma amaçlıdır.</footer><script>
const initial=/* PANEL_DATA */null;
const app=document.querySelector('#app'); let data,tab='home';
const esc=x=>String(x??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const date=x=>new Date(x); const day=x=>new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Istanbul',year:'numeric',month:'2-digit',day:'2-digit'}).format(date(x)); const time=x=>new Intl.DateTimeFormat('tr-TR',{timeZone:'Europe/Istanbul',hour:'2-digit',minute:'2-digit'}).format(date(x));
const add=(x,n)=>new Date(date(x).getTime()+n*86400000); const norm=x=>String(x||'').toLocaleLowerCase('tr-TR').replace(/[^\p{L}\p{N}]+/gu,' ').trim();
function grouped(c){let groups=[]; for(const p of c.plan||[]){if(!p.tarih||isNaN(date(p.tarih)))continue; let key=norm(p.baslik);let g=groups.find(v=>key&&v.key===key&&Math.abs(date(v.tarih)-date(p.tarih))<86400000&&!v.platforms.includes(p.platform));if(!g){g={...p,key,platforms:[]};groups.push(g)}g.platforms.push(p.platform)}return groups.sort((a,b)=>date(a.tarih)-date(b.tarih))}
function icons(g){return g.platforms.map(p=>({youtube:'YT',instagram:'IG',tiktok:'TT'}[String(p).toLowerCase()]||p)+' ✓').map(esc).join(' ')}
function rows(gs){return gs.length?gs.map(g=>`<div class="row"><div class="time">${time(g.tarih)}</div><div class="content"><div class="title">${esc(g.kanal)}</div><div>${esc(g.baslik)}</div><div class="platforms">${icons(g)}</div></div></div>`).join(''):'<p class="empty">Kayıt yok veya veri alınamadı.</p>'}
function card(title,body,cls=''){return `<section class="card ${cls}"><h2>${title}</h2>${body}</section>`}
function plans(){return (data.kanallar||[]).flatMap(c=>grouped(c).map(g=>({...g,kanal:c.ad}))).sort((a,b)=>date(a.tarih)-date(b.tarih))}
function draw(){let all=plans(),now=data.zaman||new Date().toISOString(),cs=data.kanallar||[],out=''; if(tab==='home'){let attention=cs.filter(c=>(c.uyari||[]).length||(/hata kaydı var/i).test(c.hata||''));out=card('Bugün',rows(all.filter(g=>day(g.tarih)===day(now))))+card('Yarın',rows(all.filter(g=>day(g.tarih)===day(add(now,1)))))+card('Dikkat',attention.length?`<p>${attention.length} kanalda kontrol gereken bilgi var. <button onclick="selectTab('channels')">Kanalları aç →</button></p>`:'<p class="empty">Doğrulanmış yeni uyarı yok.</p>','attention')}
if(tab==='calendar'){for(let i=0;i<7;i++){let d=add(now,i);out+=card(new Intl.DateTimeFormat('tr-TR',{timeZone:'Europe/Istanbul',weekday:'long',day:'numeric',month:'long'}).format(d),rows(all.filter(g=>day(g.tarih)===day(d))))}}
if(tab==='channels'){out=cs.map(c=>{let gs=grouped(c),v=(c.yayin||[]).filter(x=>x.izlenme!=null),rates=(c.yayin||[]).filter(x=>x.oran!=null).map(x=>Number(x.oran)).filter(Number.isFinite),warn=(c.uyari||[]).length||(/hata kaydı var/i).test(c.hata||'');let next=gs.find(g=>date(g.tarih)>=date(now));return `<section class="card"><details><summary><span class="status ${warn?'':' '}"></span>${esc(c.ad)}</summary><p>Sonraki yayın: ${next?esc(time(next.tarih)+' · '+next.baslik):'Bilinmiyor'}</p><p>Planlı: ${gs.length} · Stok adayı: ${(c.stok_aday||[]).length} ?</p><p>Son 7 gün: ${v.length?v.reduce((a,x)=>a+(Number(x.izlenme)||0),0).toLocaleString('tr-TR')+' izlenme':'izlenme bilinmiyor'} · Ortalama: ${rates.length?'%'+(rates.reduce((a,b)=>a+b,0)/rates.length).toFixed(1):'bilinmiyor'}</p><p>${esc((c.uyari||[]).join(' · ')||'Kontrol gereken bilgi yok')}</p></details><p class="muted">${next?esc(time(next.tarih)+' · '+next.baslik):'Sonraki yayın bilinmiyor'}<br>Planlı ${gs.length} · Stok adayı ${(c.stok_aday||[]).length} ?</p></section>`}).join('')}
if(tab==='production')out=cs.filter(c=>(c.is||'').includes('Çalışan')).map(c=>card(esc(c.ad),`<p>${esc(c.is)}</p><p>Model, son satır ve süre: bilinmiyor</p>`)).join('')||card('Üretim','<p class="empty">Doğrulanmış çalışan iş bilgisi yok.</p>');
if(tab==='system'){let n=data.nobetci||{};out=card('Model kotaları',`<p>${esc(data.kota||'Bilinmiyor')}</p>`)+card('Nöbetçi',`<p>${n.uyarilar?Object.keys(n.uyarilar).length+' kayıtlı uyarı izi':'Durum bilgisi yok'}</p><p class="muted">Kayıtlar geçmişe ait olabilir; güncel müdahale sayısı doğrulanamadı.</p>`)}app.innerHTML=out}
function selectTab(t){tab=t;document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===t)));draw()}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>selectTab(b.dataset.tab));
async function start(){try{if(initial)data=initial;else{let key=new URLSearchParams(location.search).get('k')||location.hash.slice(1).split('&').find(x=>x&&!x.includes('='))||'';if(location.search)history.replaceState(null,'',location.pathname+location.hash);/* Telegram hash parameters */window._adim='anahtar';if(!key)throw Error('Anahtar bulunamadı');window._adim='indirme';let obj=await (await fetch('veri.enc.json',{cache:'no-store'})).json();let dec=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));window._adim='sifre-cozme';let k=await crypto.subtle.importKey('raw',dec(key),'AES-GCM',false,['decrypt']);let plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:dec(obj.iv)},k,dec(obj.data));data=JSON.parse(new TextDecoder().decode(plain))}document.querySelector('#stamp').textContent='Son yenileme: '+new Intl.DateTimeFormat('tr-TR',{timeZone:'Europe/Istanbul',dateStyle:'short',timeStyle:'short'}).format(date(data.zaman));draw()}catch(e){let h=location.hash.slice(1),parts=h.split('&');app.innerHTML='<div class="card">Veriler açılamadı.<br><small>Teşhis: adım='+esc(window._adim||'?')+' · hata='+esc(e.name+': '+e.message)+' · hash parça='+parts.length+' · ilk parça uzunluğu='+(parts[0]||'').length+' · tg parametresi='+(h.includes('tgWebApp')?'var':'yok')+' · sürüm=d2</small></div>'}}start();
</script></body></html>
