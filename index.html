<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark"><meta name="referrer" content="no-referrer"><title>Yayın masası</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
:root{--bg:#edf2f8;--surface:#fff;--ink:#142b46;--muted:#51647b;--line:#d7e1ed;--blue:#285da8;--tint:#e7effb;--green:#187052;--green-bg:#e4f3eb;--yellow:#935b06;--yellow-bg:#fff2d7;--red:#b43645;--red-bg:#ffebee;--nav:#fffffff2;color-scheme:light}

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}button,select{font:inherit;min-height:44px}button{cursor:pointer}button,a,summary,select{touch-action:manipulation}a{color:var(--blue)}button:focus-visible,a:focus-visible,summary:focus-visible,select:focus-visible{outline:3px solid var(--blue);outline-offset:3px}header,main,footer,.nav-inner{max-width:820px;margin:auto}header{padding:24px 20px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{display:flex;gap:10px;align-items:center}.mark{height:38px;width:38px;background:var(--ink);color:var(--surface);border-radius:12px;display:grid;place-items:center}.mark svg{width:25px}.brand strong{display:block;font:600 23px/1.2 Bahnschrift,'Segoe UI',sans-serif;letter-spacing:-.7px}.meta,.muted,small{font-size:15px;color:var(--muted)}.theme{color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:50%;width:44px;flex-shrink:0;display:grid;place-items:center}.theme svg{width:21px}main{padding:0 18px 16px;min-height:65vh}h1{font:600 30px/1.2 Bahnschrift,'Segoe UI',sans-serif;letter-spacing:-.8px;margin:4px 0 8px}h2{font:600 21px/1.3 Bahnschrift,'Segoe UI',sans-serif;letter-spacing:-.35px;margin:0}h3{font-size:17px;line-height:1.4;margin:0}p{margin:8px 0}.intro{margin-bottom:22px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:24px 0 12px}.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;margin:12px 0;overflow:hidden}.hero{background:#193b66;color:#f1f6ff;border-radius:24px;padding:22px}.hero .muted,.hero small{color:inherit;opacity:.85}.hero .big{font:600 42px/1.2 Bahnschrift,'Segoe UI',sans-serif;letter-spacing:-1.4px;margin:10px 0}.hero .big.word{font-size:32px}.hero-top,.between{display:flex;justify-content:space-between;align-items:center;gap:10px}.hero-bottom{border-top:1px solid #ffffff44;margin-top:18px;padding-top:14px;display:flex;justify-content:space-between;gap:12px}.hero-bottom strong{font-size:23px;display:block}.pill{display:inline-flex;align-items:center;gap:5px;font-size:15px;line-height:1.3;padding:5px 9px;border-radius:9px;background:var(--tint);color:var(--blue);overflow-wrap:anywhere}.pill.ok{background:var(--green-bg);color:var(--green)}.pill.warn{background:var(--yellow-bg);color:var(--yellow)}.pill.bad{background:var(--red-bg);color:var(--red)}.hero .pill{background:#ffffff20;color:inherit}.alert{border-left:4px solid var(--yellow);border-radius:12px;background:var(--yellow-bg);padding:13px 15px;margin:14px 0}.alert.bad{border-color:var(--red);background:var(--red-bg)}.alert p{margin:3px 0;font-size:15px}.link-button{border:0;background:transparent;color:var(--blue);padding:8px 0;text-align:left;font-weight:600}.timeline{padding:0 16px}.schedule{display:grid;grid-template-columns:49px minmax(0,1fr);gap:15px;padding:18px 0;border-top:1px solid var(--line)}.schedule:first-child{border-top:0}.clock{font:600 19px/1.4 Bahnschrift,'Segoe UI',sans-serif;padding-top:2px}.schedule .content{border-left:2px solid var(--line);padding-left:15px}.title{font-weight:600;overflow-wrap:anywhere}.subline{margin-top:4px;font-size:15px;color:var(--muted)}.platforms{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.platform{font-size:15px;font-weight:700;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--muted)}.platform.yt{color:var(--red)}.platform.ig{color:var(--blue)}.platform.tt{color:var(--ink)}.empty{padding:12px 0;color:var(--muted);font-size:15px}.stat-pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat-pair .card{margin:0}.stat-pair strong{font:600 29px/1.3 Bahnschrift,'Segoe UI',sans-serif;display:block}.toolbar{display:flex;align-items:center;gap:8px;margin:16px 0}.toolbar select{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:9px 12px}.video-table{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden}.video-row{padding:16px;border-top:1px solid var(--line)}.video-row:first-child{border-top:0}.video-heading{display:flex;justify-content:space-between;gap:10px;margin-bottom:6px}.video-heading small{flex-shrink:0}.video-metrics{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:8px;margin-top:13px}.video-metrics span{display:block;color:var(--muted);font-size:15px}.video-metrics strong{font-size:18px;font-weight:650;overflow-wrap:anywhere}.video-heading .channel{color:var(--blue);font-size:15px;font-weight:600}.video-extra{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:12px;font-size:15px;color:var(--muted)}summary{cursor:pointer;min-height:44px;list-style:none}summary::-webkit-details-marker{display:none}summary .between::after{content:'+';font-size:24px;color:var(--muted)}details[open] summary .between::after{content:'−'}.spark{width:100%;height:64px;display:block;margin:12px 0 2px;color:var(--blue)}.channel-card .between h3{flex:1}.numbers{display:flex;justify-content:space-between;gap:12px;margin:10px 0}.numbers strong{font-size:23px;display:block}.detail{border-top:1px solid var(--line);margin-top:14px;padding-top:10px}.job{border-left:3px solid var(--line)}.job.running{border-left-color:var(--green)}.job .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.job .top h3{flex:1}.job p{overflow-wrap:anywhere;font-size:15px}.log{background:var(--bg);padding:10px 12px;border-radius:10px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px;color:var(--muted);margin-top:10px}.meter{height:10px;background:var(--line);border-radius:8px;overflow:hidden;margin:16px 0 8px}.meter span{display:block;height:100%;background:var(--green);border-radius:8px}.render-count{font:600 38px/1.2 Bahnschrift,'Segoe UI',sans-serif}.model{padding:16px 0;border-top:1px solid var(--line)}.model:first-child{border:0;padding-top:0}.model h3{overflow-wrap:anywhere;margin-bottom:8px}.model:last-child{padding-bottom:0}.list-item{border-top:1px solid var(--line);padding:12px 0;overflow-wrap:anywhere;font-size:15px}.list-item:first-child{border-top:0}.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--nav);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);backdrop-filter:blur(18px);z-index:20}.nav-inner{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:7px 8px 9px}.tabs button{border:0;border-radius:13px;background:transparent;color:var(--muted);min-height:58px;min-width:0;padding:5px 0;font-size:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}.tabs svg{width:21px;height:21px}.tabs button[aria-selected=true]{background:var(--tint);color:var(--blue);font-weight:700}footer{padding:8px 20px 105px;color:var(--muted);font-size:15px}.view{animation:appear .16s ease-out}@keyframes appear{from{opacity:.5;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){.view{animation:none}}@media(min-width:700px){main{padding:0 24px}header{padding-left:26px;padding-right:26px}.channel-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.channel-grid .card{margin:0}.hero .big{font-size:56px}}

.growth{width:100%;display:block;margin-top:10px}.milestone{display:grid;grid-template-columns:60px minmax(0,1fr) auto;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}.milestone small{grid-column:1/-1}code{overflow-wrap:anywhere;font-size:15px}.detail p{overflow-wrap:anywhere}.channel-card summary small{display:block}.video-row>summary{display:block}.channel-grid .between{flex-wrap:wrap}
</style></head><body><header><div class="brand"><span class="mark" aria-hidden="true"><svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 19V9m6 15V4m6 16V8m6 9v-6"/></svg></span><div><strong>Yayın masası</strong><span class="meta" id="header-date">Panel v4</span></div></div><button class="theme" id="theme" aria-label="Renk temasını değiştir"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 14A8 8 0 0 1 10 4a8 8 0 1 0 10 10Z"/></svg></button></header><main id="app" aria-live="polite"><div class="card">Veriler açılıyor…</div></main><footer><div id="stamp"></div>Türkiye saati · Panel v4</footer><nav class="tabs" aria-label="Panel sekmeleri"><div class="nav-inner" role="tablist">
<button role="tab" data-tab="home" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m3 10 9-7 9 7v11h-6v-7H9v7H3Z"/></svg>Özet</button><button role="tab" data-tab="analysis" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 3v18h17M8 16l4-5 4 2 5-8"/></svg>Analiz</button><button role="tab" data-tab="calendar" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 2v6m10-6v6M3 11h18m-14 4h3m4 0h3"/></svg>Takvim</button><button role="tab" data-tab="production" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m10 4 10 8-10 8ZM4 4v16"/></svg>Üretim</button><button role="tab" data-tab="system" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="6" rx="2"/><rect x="3" y="14" width="18" height="6" rx="2"/><path d="M7 7h1m-1 10h1m4-10h5m-5 10h5"/></svg>Sistem</button></div></nav><script>
'use strict';const initial=/* PANEL_DATA */null;
const app=document.querySelector('#app');let data,tab='home',filter='';
const esc=x=>String(x??'bilinmiyor').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const number=x=>x==null?'Bilinmiyor':Number(x).toLocaleString('tr-TR',{maximumFractionDigits:1});
const date=x=>new Date(x),day=x=>new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Istanbul',year:'numeric',month:'2-digit',day:'2-digit'}).format(date(x));
const time=x=>new Intl.DateTimeFormat('tr-TR',{timeZone:'Europe/Istanbul',hour:'2-digit',minute:'2-digit'}).format(date(x));
const stamp=x=>x?new Intl.DateTimeFormat('tr-TR',{timeZone:'Europe/Istanbul',dateStyle:'short',timeStyle:'short'}).format(date(x)):'bilinmiyor';
const add=(x,n)=>new Date(date(x).getTime()+n*86400000),norm=x=>String(x||'').toLocaleLowerCase('tr-TR').replace(/[^\p{L}\p{N}]+/gu,' ').trim();
const cleanTitle=x=>String(x??'').replace(/[0-9#*]\ufe0f?\u20e3/gu,'').replace(/#[\p{L}\p{N}_]+/gu,'').replace(/\p{Extended_Pictographic}|\p{Regional_Indicator}|\p{Emoji_Modifier}|[\u200d\ufe0e\ufe0f\u20e3\u{e0020}-\u{e007f}]/gu,'').replace(/\s+/gu,' ').trim()||'Başlıksız';
const title=x=>esc(cleanTitle(x));
function currentJob(j){const age=(Date.now()/1000)-j.son_aktivite;return j.aktif===true&&Number.isFinite(age)&&age>=0&&age<=86400}
const blockedJobs=()=> (data.uretim?.isler||[]).filter(j=>currentJob(j)&&['TAKILDI','KOTA','HATA'].includes(j.durum));
function pill(t,k=''){return `<span class="pill ${k}">${esc(t)}</span>`}function card(t,b,c=''){return `<section class="card ${c}"><h2>${esc(t)}</h2>${b}</section>`}function heading(t,n=''){return `<div class="section-head"><h2>${esc(t)}</h2>${n!==''?pill(n):''}</div>`}function empty(t='Kayıt yok. Kaynak bilgisi Sistem sekmesinde.'){return `<p class="empty">${esc(t)}</p>`}
function grouped(c){if(c.plan_gruplari)return c.plan_gruplari.map(g=>({...g,kanal:c.ad}));let gs=[];for(const p of c.plan||[]){if(!p.tarih||isNaN(date(p.tarih)))continue;const key=p.video_id||norm(p.baslik);let g=gs.find(v=>key&&v.key===key&&day(v.tarih)===day(p.tarih)&&!v.platforms.some(q=>q.platform===p.platform));if(!g){g={...p,key,kanal:c.ad,platforms:[]};gs.push(g)}g.platforms.push({platform:p.platform,tarih:p.tarih})}return gs}
function plans(){return(data.kanallar||[]).flatMap(grouped).sort((a,b)=>date(a.tarih)-date(b.tarih))}
function platform(g){return `<div class="platforms">${g.platforms.map(p=>{const k=String(p.platform).toLowerCase(),s=({youtube:'YT',instagram:'IG',tiktok:'TT'})[k]||p.platform;return `<span class="platform ${s.toLowerCase()}">${esc(s)}${time(p.tarih)!==time(g.tarih)?' '+time(p.tarih):''}</span>`}).join('')}</div>`}
function rows(gs){return gs.length?`<div class="card timeline">${gs.map(g=>`<article class="schedule"><div class="clock">${time(g.tarih)}</div><div class="content"><div class="subline">${esc(g.kanal)}</div><div class="title">${title(g.baslik)}</div>${platform(g)}</div></article>`).join('')}</div>`:empty('Planlı yayın kaydı yok. Bağlantı uyarılarını Sistem’den kontrol et.')}
function spark(series){let segments=[],line=[],pts=[],vs=series.filter(s=>s.deger!=null).map(s=>s.deger);if(!vs.length)return empty('14 günlük grafik için karşılaştırma yok.');let lo=Math.min(0,...vs),hi=Math.max(1,...vs);series.forEach((s,i)=>{if(s.deger==null){if(line.length)segments.push(line);line=[];return}let x=5+i*310/Math.max(1,series.length-1),y=55-(s.deger-lo)/(hi-lo)*45;line.push(`${x},${y}`);pts.push(`<circle cx="${x}" cy="${y}" r="3.5"><title>${esc(s.tarih)}: ${number(s.deger)} izlenme</title></circle>`)});if(line.length)segments.push(line);return `<svg class="spark" viewBox="0 0 320 64" role="img" aria-label="14 günlük artış, ${vs.length} gün ölçüldü"><path d="M5 55H315" stroke="var(--line)"/>${segments.map(s=>`<polyline points="${s.join(' ')}" fill="none" stroke="currentColor" stroke-width="2.5"/>`).join('')}<g fill="currentColor">${pts.join('')}</g></svg><div class="between muted"><span>${esc(series[0].tarih.slice(5))}</span><span>${vs.length}/14 gün ölçüldü</span><span>${esc(series.at(-1).tarih.slice(5))}</span></div>`}
function overview(){const a=data.analiz||{},all=plans(),now=data.zaman,today=all.filter(g=>day(g.tarih)===day(now)),tomorrow=all.filter(g=>day(g.tarih)===day(add(now,1))),blocked=blockedJobs(),candidates=data.onay_adaylari||[],warnings=(data.kanallar||[]).filter(c=>c.uyari?.length),best=(a.son15||[]).filter(v=>v.izlenme!=null).sort((x,y)=>y.izlenme-x.izlenme)[0];let out=`<div class="intro"><h1>Akış kontrol altında mı?</h1><p class="muted">Yayınlar, sonuçlar ve bekleyen işler.</p></div><section class="hero">${a.artis7!=null?`<div class="hero-top"><span>Son 7 gün izlenme artışı</span>${pill(a.degisim7==null?'Karşılaştırma yok':`${a.degisim7>=0?'↑':'↓'} %${number(Math.abs(a.degisim7))}`)}</div><div class="big">${number(a.artis7)}</div><small>${a.kapsam7||0}/${a.toplam_kanal||0} kanal ölçülebildi · ${a.kayit_sayisi||0} günlük kayıt</small>`:`<div class="hero-top"><span>Son 24 saatin en iyi videosu</span></div>${a.en_iyi24?`<p>${esc(a.en_iyi24.kanal)}</p><h2>${title(a.en_iyi24.baslik)}</h2><div class="big">${number(a.en_iyi24.izlenme)}</div><p>izlenme · ${a.en_iyi24.kat==null?'Ortanca katı bilinmiyor':number(a.en_iyi24.kat)+'× ortanca'}</p>${a.en_iyi24.yaklasik?'<p><small>İzlenme: son arşiv ölçümü</small></p>':''}`:'<p>Son 24 saatte yayımlanan, saati ve izlenmesi bilinen video yok.</p>'}<small>7 günlük karşılaştırma için ${a.eksik_gun7??8} gün daha kayıt gerekiyor</small>`}<div class="hero-bottom"><div><span class="muted">Son günlük ölçüm</span><strong>${a.artis24==null?'Bilinmiyor':number(a.artis24)}</strong></div><div><span class="muted">Bugün / yarın</span><strong>${today.length} / ${tomorrow.length} yayın</strong></div></div></section>`;
if(blocked.length||candidates.length)out+=`<div class="alert ${blocked.length?'bad':''}"><strong>${blocked.length?blocked.length+' iş kontrol bekliyor':candidates.length+' onay adayı var'}</strong><p>${blocked.length?'Son 24 saatte aktif olan işlerde takılma, kota veya hata kaydı var.':'Telefon dosyaları bulundu; yayın eşleşmesi kesin değil.'}</p><button class="link-button" data-go="production">Üretimi incele</button></div>`;
out+=`<p class="muted">Günlük artış: ${a.kapsam24||0}/${a.toplam_kanal||0} kanal · Ölçüm: ${stamp(a.son_olcum)}</p>`+heading('Bugün',today.length)+rows(today)+heading('Yarın',tomorrow.length)+rows(tomorrow);if(best)out+=heading('Son 15 içinde öne çıkan')+`<section class="card"><div class="between"><span class="muted">${esc(best.kanal)}</span>${pill(best.kat==null?'Kat bilinmiyor':number(best.kat)+'× ortanca','ok')}</div><h3 style="margin-top:10px">${title(best.baslik)}</h3><div class="numbers"><strong>${number(best.izlenme)} izlenme</strong></div><small>Toplam izlenmeye göre · ${number(best.yas_saat)} saatlik</small><br><button class="link-button" data-go="analysis">Tüm video analizleri</button></section>`;

function growth48(v){
 const actual=(v.egri||[]).filter(p=>p.saat>=0&&p.saat<=48),reference=(v.ortanca_egri||[]).filter(p=>p.saat<=48);
 const values=[...actual,...reference].filter(p=>p.izlenme!=null).map(p=>p.izlenme);
 if(!values.length)return empty('İlk 48 saate ait ölçüm yok. Saatlik arşiv başladıkça grafik oluşacak.');
 const max=Math.max(1,...values),x=t=>38+t/48*282,y=n=>136-n/max*112;
 function series(points,color,ref=false){let segments=[],seg=[],dots=[];let last=null;
  for(const p of points){if(p.izlenme==null){if(seg.length)segments.push(seg);seg=[];last=null;continue}
   if(last!=null&&!ref&&p.saat-last>2){if(seg.length)segments.push(seg);seg=[]}
   seg.push(`${x(p.saat)},${y(p.izlenme)}`);last=p.saat;
   dots.push(`<circle cx="${x(p.saat)}" cy="${y(p.izlenme)}" r="3" fill="${color}"><title>${number(p.saat)} saat: ${number(p.izlenme)} izlenme</title></circle>`)
  }if(seg.length)segments.push(seg);
  return segments.filter(s=>s.length>1).map(s=>`<polyline points="${s.join(' ')}" fill="none" stroke="${color}" stroke-width="2.5" ${ref?'stroke-dasharray="5 4"':''}/>`).join('')+dots.join('')
 }
 return `<svg class="growth" viewBox="0 0 332 170" role="img" aria-label="İlk 48 saat izlenme eğrisi"><g stroke="var(--line)" fill="none"><path d="M38 24V136H320"/><path d="M38 80H320" stroke-dasharray="2 4"/></g><g fill="var(--muted)" font-size="14"><text x="2" y="30">${new Intl.NumberFormat('tr-TR',{notation:'compact',maximumFractionDigits:1}).format(max)}</text><text x="18" y="140">0</text><text x="38" y="161">0</text><text x="168" y="161">24</text><text x="290" y="161">48 sa.</text></g>${series(reference,'var(--green)',true)}${series(actual,'var(--blue)')}</svg><p class="muted">Mavi: gerçek ölçüm · Yeşil kesikli: aynı yaştaki en az 3 başka videonun ortancası. Eksik noktalar doldurulmaz.</p>`
}

window._q=location.search;let cryptoKey;function decode(s){return Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0))}async function fetchData(){const r=await fetch('veri.enc.json',{cache:'no-store'});if(!r.ok)throw Error('veri');const o=await r.json(),p=await crypto.subtle.decrypt({name:'AES-GCM',iv:decode(o.iv)},cryptoKey,decode(o.data));return JSON.parse(new TextDecoder().decode(p))}function paint(){document.querySelector('#header-date').textContent=new Intl.DateTimeFormat('tr-TR',{timeZone:'Europe/Istanbul',weekday:'short',day:'numeric',month:'long'}).format(date(data.zaman));document.querySelector('#stamp').textContent='Son yenileme: '+stamp(data.zaman);draw()}
async function start(){try{if(initial)data=initial;else{const key=new URLSearchParams(window._q).get('k')||location.hash.slice(1).split('&').find(x=>x&&!x.includes('='))||'';const q=new URLSearchParams(location.search);q.delete('k');history.replaceState(null,'',location.pathname+(q.size?'?'+q:'')+location.hash);if(!key)throw Error('anahtar');cryptoKey=await crypto.subtle.importKey('raw',decode(key),'AES-GCM',false,['decrypt']);data=await fetchData()}window._q='';paint();if(!initial)setInterval(async()=>{try{data=await fetchData();const y=scrollY;paint();scrollTo(0,y)}catch{document.querySelector('#stamp').textContent='Yenileme alınamadı. Son başarılı veri: '+stamp(data.zaman)}},300000)}catch{window._q='';app.innerHTML=card('Veriler açılamadı','<p>Paneli Telegram menüsündeki güncel bağlantıdan yeniden aç.</p><p class="muted">Bağlantı anahtarı eksik, geçersiz veya veri bağlantısı kesilmiş olabilir.</p>')}}start();
</script></body></html>
